name: Gerar Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: github-profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVG dark em verde neon
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: emanuelfelipehub
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00ff41&color_dots=#0d1117,#003b12,#006b21,#00a835,#00ff41

      - name: Publicar SVG na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: atualizar snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
