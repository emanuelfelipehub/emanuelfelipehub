  <rect x="14" y="14" width="148" height="182" rx="10" fill="#000f06" fill-opacity=".6" stroke="#00ff41" stroke-opacity=".3"/>
  <g clip-path="url(#iconclip)">
  <rect x="36" y="59" width="104" height="100" rx="8" fill="#001a0c" stroke="#00ff41" stroke-width="2.5" filter="url(#glowS)"/>
  <rect x="36" y="59" width="104" height="24" rx="8" fill="#00ff41" fill-opacity=".35"/>
  <path d="M60 49 V67 M116 49 V67" stroke="#00ff41" stroke-width="4" stroke-linecap="round"/>
  <text x="88" y="76" font-size="11" font-weight="700" fill="#00ff41" text-anchor="middle">AGENDA</text>
  <rect x="46" y="93" width="16" height="12" rx="2" fill="#00ff41" fill-opacity=".18"/><rect x="68" y="93" width="16" height="12" rx="2" fill="#00ff41" fill-opacity=".18"/><rect x="90" y="93" width="16" height="12" rx="2" fill="#00ff41" fill-opacity=".18"/><rect x="112" y="93" width="16" height="12" rx="2" fill="#00ff41" fill-opacity=".18"/><rect x="46" y="111" width="16" height="12" rx="2" fill="#00ff41" fill-opacity=".18"/><rect x="68" y="111" width="16" height="12" rx="2" fill="#00ff41" fill-opacity=".18"/><rect x="90" y="111" width="16" height="12" rx="2" fill="#00ff41" fill-opacity=".18"/><rect x="112" y="111" width="16" height="12" rx="2" fill="#00ff41" fill-opacity=".18"/><rect x="46" y="129" width="16" height="12" rx="2" fill="#00ff41" fill-opacity=".18"/><rect x="68" y="129" width="16" height="12" rx="2" fill="#00ff41" fill-opacity=".18"/><rect x="90" y="129" width="16" height="12" rx="2" fill="#00ff41" fill-opacity=".18"/><rect x="112" y="129" width="16" height="12" rx="2" fill="#00ff41" fill-opacity=".18"/>
  <rect class="hop" x="45" y="92" width="18" height="14" rx="3" fill="none" stroke="#00ff41" stroke-width="2.5" filter="url(#glowS)"/></g>
  <text x="178" y="38" font-size="12" fill="#3ddc6a">[ worldskills · B2 ]</text>
  <g class="" transform="translate(380 30) scale(0.55)">
    <path d="M-14 -16 H14 V-4 Q14 12 0 14 Q-14 12 -14 -4 Z" fill="#00ff41" fill-opacity=".25" stroke="#00ff41" stroke-width="2.5"/>
    <path d="M-14 -11 H-21 Q-22 2 -12 4 M14 -11 H21 Q22 2 12 4" fill="none" stroke="#00ff41" stroke-width="2.5"/>
    <path d="M0 14 V21 M-9 25 H9 V21 H-9 Z" fill="#00ff41" stroke="#00ff41" stroke-width="2"/>
    <text x="0" y="3" font-size="13" font-weight="700" fill="#00ff41" text-anchor="middle">1</text>
  </g>
  <text class="b" x="178" y="68" font-size="22" fill="#00ff41" filter="url(#glowS)">Aprender+ B2</text>
  <text x="178" y="92" font-size="14" fill="#00ff41">Design de interface</text>
  <text x="178" y="120" font-size="13" fill="#c4ffd3">Explorar cursos, agenda</text><text x="178" y="139" font-size="13" fill="#c4ffd3">e perfil do estudante.</text>
  <rect x="178.0" y="158" width="47.0" height="22" rx="11" fill="#00ff41" fill-opacity=".12" stroke="#00ff41" stroke-opacity=".7"/><text x="201.5" y="173" font-size="11" fill="#00ff41" text-anchor="middle">Figma</text><rect x="231.0" y="158" width="47.0" height="22" rx="11" fill="#00ff41" fill-opacity=".12" stroke="#00ff41" stroke-opacity=".7"/><text x="254.5" y="173" font-size="11" fill="#00ff41" text-anchor="middle">UI/UX</text>
  <text x="178" y="196" font-size="11" fill="#3ddc6a">&gt; abrir repositório_</text>
  <rect class="scanbar" width="410" height="120" fill="url(#scan)"/><rect width="410" height="210" fill="url(#lines)"/>
</g>
<rect x="1" y="1" width="408" height="208" rx="13" fill="none" stroke="#00ff41" stroke-opacity=".45" stroke-width="2"/><rect class="run" x="1" y="1" width="408" height="208" rx="13" fill="none" stroke="#00ff41" stroke-width="3" stroke-dasharray="140 1100" filter="url(#glowS)"/>
</svg>