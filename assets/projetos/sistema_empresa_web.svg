  <rect x="177" y="84" width="40" height="52" fill="#001a0c" stroke="#00c832" stroke-width="2"/>
  <rect x="49" y="96" width="36" height="40" fill="#001a0c" stroke="#00c832" stroke-width="2"/>
  <rect x="95" y="38" width="80" height="98" fill="#001a0c" stroke="#00ff41" stroke-width="2.5" filter="url(#glowS)"/>
