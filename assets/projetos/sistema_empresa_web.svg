  <circle class="blink" cx="135" cy="18" r="3.5" fill="#00ff41" filter="url(#glowS)"/>
  <rect class="win" style="animation-delay:-2.52s;animation-duration:3.47s" x="105" y="48" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-0.81s;animation-duration:3.82s" x="121" y="48" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-0.76s;animation-duration:4.17s" x="137" y="48" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-0.14s;animation-duration:4.93s" x="153" y="48" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-0.98s;animation-duration:3.84s" x="105" y="64" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-1.05s;animation-duration:4.84s" x="121" y="64" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-1.33s;animation-duration:4.66s" x="137" y="64" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-3.13s;animation-duration:4.46s" x="153" y="64" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-3.96s;animation-duration:3.61s" x="105" y="80" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-3.67s;animation-duration:4.53s" x="121" y="80" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-0.54s;animation-duration:2.85s" x="137" y="80" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-0.40s;animation-duration:3.67s" x="153" y="80" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-3.69s;animation-duration:3.51s" x="105" y="96" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-3.21s;animation-duration:3.75s" x="121" y="96" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-3.63s;animation-duration:3.56s" x="137" y="96" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-1.55s;animation-duration:2.64s" x="153" y="96" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-3.64s;animation-duration:4.14s" x="105" y="112" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-1.29s;animation-duration:3.79s" x="121" y="112" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-3.19s;animation-duration:3.14s" x="137" y="112" width="10" height="10" fill="#00ff41"/><rect class="win" style="animation-delay:-0.78s;animation-duration:2.60s" x="153" y="112" width="10" height="10" fill="#00ff41"/>
  <rect x="127" y="122" width="16" height="14" fill="#00ff41" fill-opacity=".4"/></g>
