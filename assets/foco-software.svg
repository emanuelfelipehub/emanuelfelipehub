  <circle cx="127" cy="88" r="28" fill="#00331a" stroke="#00c832" stroke-width="2"/>
  <path class="spinr" d="M195.0,44.0 L200.4,48.9 L198.8,53.5 L191.5,54.0 L189.0,56.5 L188.5,63.8 L183.9,65.4 L179.0,60.0 L175.4,59.6 L169.5,63.8 L165.3,61.2 L166.5,54.0 L164.6,50.9 L157.6,48.9 L157.0,44.0 L163.4,40.4 L164.6,37.1 L161.8,30.3 L165.3,26.8 L172.1,29.6 L175.4,28.4 L179.0,22.0 L183.9,22.6 L185.9,29.6 L189.0,31.5 L196.2,30.3 L198.8,34.5 L194.6,40.4 Z" fill="#001a0c" stroke="#00c832" stroke-width="2"/>
  <text class="b" x="127" y="95" font-size="20" fill="#00ff41" text-anchor="middle" filter="url(#glowS)">&lt;/&gt;</text></g>
  <text x="20" y="182" font-size="12" fill="#3ddc6a">[ foco_01 ]</text><text class="b" x="20" y="208" font-size="21" fill="#00ff41" filter="url(#glowS)">Engenharia de</text><text class="b" x="20" y="234" font-size="21" fill="#00ff41" filter="url(#glowS)">Software</text><text x="20" y="262" font-size="14" fill="#c4ffd3">Projetar sistemas</text><text x="20" y="282" font-size="14" fill="#c4ffd3">organizados, testados</text><text x="20" y="302" font-size="14" fill="#c4ffd3">e fáceis de manter.</text>
  <rect class="scanbar" width="270" height="120" fill="url(#scan)"/><rect width="270" height="328" fill="url(#lines)"/>
</g>
<rect x="1" y="1" width="268" height="326" rx="13" fill="none" stroke="#00ff41" stroke-opacity=".45" stroke-width="2"/><rect class="run" x="1" y="1" width="268" height="326" rx="13" fill="none" stroke="#00ff41" stroke-width="3" stroke-dasharray="140 1056" filter="url(#glowS)"/>
</svg>