<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="620" height="220" role="img" aria-label="Conquista: 1º lugar na primeira etapa da seletiva escolar da WorldSkills, Desenvolvimento de Aplicativos Móveis"><defs>
  <radialGradient id="bgg" cx="50%" cy="35%" r="80%">
    <stop offset="0" stop-color="#005c25"/>
    <stop offset=".5" stop-color="#002a11"/>
    <stop offset="1" stop-color="#000f06"/>
  </radialGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" fill="none" stroke="#00ff41" stroke-opacity=".08"/>
  </pattern>
  <pattern id="lines" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" fill="#000" fill-opacity=".22"/>
  </pattern>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
    <stop offset=".5" stop-color="#00ff41" stop-opacity=".09"/>
    <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowS" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="1.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="round"><rect width="620" height="220" rx="14"/></clipPath>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00ff41" stop-opacity=".55"/><stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#00ff41" stop-opacity=".05"/><stop offset="1" stop-color="#00ff41" stop-opacity=".5"/>
  </linearGradient><clipPath id="iconclip"><rect x="14" y="14" width="172" height="192" rx="10"/></clipPath></defs><style>
  text { font-family: 'Courier New', Courier, monospace; }
  .b { font-family: Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace; font-weight: 700; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .scanbar { animation: scan 7s linear infinite; }
  @keyframes scan { from { transform: translateY(-120px); } to { transform: translateY(220px); } }
  .run { animation: run 6s linear infinite; }
  @keyframes run { to { stroke-dashoffset: -1680; } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 8s linear infinite; }
  .spinr { transform-box: fill-box; transform-origin: center; animation: spin 5s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .show { opacity: 0; animation: appear .2s ease-out forwards; }
  @keyframes appear { to { opacity: 1; } }
  .hover { animation: hover 3s ease-in-out infinite; }
  @keyframes hover { 50% { transform: translateY(-6px); } }
  .rotor { transform-box: fill-box; transform-origin: center; animation: rotor .18s linear infinite; }
  @keyframes rotor { 50% { transform: scaleX(.15); } }
  .beamp { animation: beam 1.6s ease-in-out infinite; }
  @keyframes beam { 50% { opacity: .35; } }
  .road { animation: road .6s linear infinite; }
  @keyframes road { to { stroke-dashoffset: 24; } }
  .bounce { animation: bounce .5s ease-in-out infinite; }
  @keyframes bounce { 50% { transform: translateY(-2px); } }
  .speed { animation: speed .5s steps(2) infinite; }
  @keyframes speed { 50% { opacity: .3; transform: translateX(-6px); } }
  .rise { opacity: 0; animation: rise 2.8s ease-out infinite; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-34px); } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse { from { transform: scale(.8); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
  .shackle { animation: lock 3s ease-in-out infinite; }
  @keyframes lock { 0%,60%,100% { transform: translateY(0); } 75% { transform: translateY(-5px); } }
  .pop { opacity: 0; animation: pop 3.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.3); } 15%,85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
  .wave { animation: wave 1.8s ease-out infinite; }
  @keyframes wave { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
  .flipc { transform-box: fill-box; transform-origin: center; animation: flipc 3s ease-in-out infinite; }
  @keyframes flipc { 0%,40%,100% { transform: scaleX(1); } 55% { transform: scaleX(0); } 70% { transform: scaleX(1); } }
  .ants { animation: ants 1s linear infinite; }
  @keyframes ants { to { stroke-dashoffset: -20; } }
  .pen { animation: pen 4s ease-in-out infinite; }
  @keyframes pen { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-40px,-30px); } 50% { transform: translate(-30px,26px); } 75% { transform: translate(10px,-40px); } }
  .hop { animation: hop 6s steps(1) infinite; }
  @keyframes hop { 0% { transform: translate(0,0); } 16% { transform: translate(22px,0); } 33% { transform: translate(66px,0); } 50% { transform: translate(22px,18px); } 66% { transform: translate(44px,36px); } 83% { transform: translate(0,36px); } }
  .eq { transform-box: fill-box; transform-origin: bottom; animation: eq .9s ease-in-out infinite alternate; }
  @keyframes eq { from { transform: scaleY(.2); } to { transform: scaleY(1); } }
  .wrench { animation: wrench 1.6s ease-in-out infinite; }
  @keyframes wrench { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-25deg); } }
  .win { animation-name: win; animation-iteration-count: infinite; animation-timing-function: steps(1); }
  @keyframes win { 0% { opacity: .9; } 50% { opacity: .15; } }.rays { transform-box: view-box; transform-origin: 100px 108px; animation: spin 14s linear infinite; } .float { animation: hover 3s ease-in-out infinite; }</style>
<g clip-path="url(#round)">
  <rect width="620" height="220" fill="url(#bgg)"/><rect width="620" height="220" fill="url(#grid)"/>
  <rect x="14" y="14" width="172" height="192" rx="10" fill="#000f06" fill-opacity=".6" stroke="#00ff41" stroke-opacity=".3"/>
  <g clip-path="url(#iconclip)">
    <g class="rays"><line x1="100" y1="108" x2="190.0" y2="108.0" stroke="#00ff41" stroke-opacity=".25" stroke-width="6"/><line x1="100" y1="108" x2="177.9" y2="153.0" stroke="#00ff41" stroke-opacity=".25" stroke-width="6"/><line x1="100" y1="108" x2="145.0" y2="185.9" stroke="#00ff41" stroke-opacity=".25" stroke-width="6"/><line x1="100" y1="108" x2="100.0" y2="198.0" stroke="#00ff41" stroke-opacity=".25" stroke-width="6"/><line x1="100" y1="108" x2="55.0" y2="185.9" stroke="#00ff41" stroke-opacity=".25" stroke-width="6"/><line x1="100" y1="108" x2="22.1" y2="153.0" stroke="#00ff41" stroke-opacity=".25" stroke-width="6"/><line x1="100" y1="108" x2="10.0" y2="108.0" stroke="#00ff41" stroke-opacity=".25" stroke-width="6"/><line x1="100" y1="108" x2="22.1" y2="63.0" stroke="#00ff41" stroke-opacity=".25" stroke-width="6"/><line x1="100" y1="108" x2="55.0" y2="30.1" stroke="#00ff41" stroke-opacity=".25" stroke-width="6"/><line x1="100" y1="108" x2="100.0" y2="18.0" stroke="#00ff41" stroke-opacity=".25" stroke-width="6"/><line x1="100" y1="108" x2="145.0" y2="30.1" stroke="#00ff41" stroke-opacity=".25" stroke-width="6"/><line x1="100" y1="108" x2="177.9" y2="63.0" stroke="#00ff41" stroke-opacity=".25" stroke-width="6"/></g>
    <circle class="pulse" cx="100" cy="108" r="44" fill="none" stroke="#00ff41" stroke-width="2"/>
    <g class="float" filter="url(#glow)"><g class="" transform="translate(100 104) scale(2.3)">
    <path d="M-14 -16 H14 V-4 Q14 12 0 14 Q-14 12 -14 -4 Z" fill="#00ff41" fill-opacity=".25" stroke="#00ff41" stroke-width="2.5"/>
    <path d="M-14 -11 H-21 Q-22 2 -12 4 M14 -11 H21 Q22 2 12 4" fill="none" stroke="#00ff41" stroke-width="2.5"/>
    <path d="M0 14 V21 M-9 25 H9 V21 H-9 Z" fill="#00ff41" stroke="#00ff41" stroke-width="2"/>
    <text x="0" y="3" font-size="13" font-weight="700" fill="#00ff41" text-anchor="middle">1</text>
  </g></g>
  </g>
  <text x="204" y="44" font-size="13" fill="#3ddc6a">[ conquista ]</text>
  <text class="b" x="204" y="92" font-size="44" fill="#00ff41" filter="url(#glow)">1º LUGAR</text>
  <text x="204" y="126" font-size="16" fill="#c4ffd3">Seletiva escolar WorldSkills · 1ª etapa</text>
  <text x="204" y="150" font-size="16" fill="#c4ffd3">Desenvolvimento de Aplicativos Móveis</text>
  <text x="204" y="186" font-size="13" fill="#3ddc6a">&gt; projeto-teste Aprender+ · módulos abaixo_</text>
  <rect class="scanbar" width="620" height="120" fill="url(#scan)"/><rect width="620" height="220" fill="url(#lines)"/>
</g>
<rect x="1" y="1" width="618" height="218" rx="13" fill="none" stroke="#00ff41" stroke-opacity=".45" stroke-width="2"/><rect class="run" x="1" y="1" width="618" height="218" rx="13" fill="none" stroke="#00ff41" stroke-width="3" stroke-dasharray="140 1540" filter="url(#glowS)"/>
</svg>